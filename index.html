<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Search</title>
  <style>

    body{
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      margin: 0;
      font-family: sans-serif;
    }

    .container{
      display: flex;
      justify-content: center;
      align-items: center;
    }

    header{
      background: #111;
      color: white;
      padding: 7px;
      margin: 7px;
    }
    input{
      padding: 7px 20px;
      border-radius: 16px;
      border: 1.5px rgb(17, 17, 92) solid;
      margin: 12px; 
    }

    input:focus{
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.35);
    }

    .searchBtn{
      padding: 3px 7px;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .searchBtn:hover{
      background: black;
      color: white;
      transform: translateY(-2px);
    }

    #results{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    img{
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 14px;
      transition: 0.3s ease;
    }

    img:hover{
      transform: scale(1.03);
    }

  </style>
</head>
<body>
  <header>
    <h1>Unlimited Glimpse</h1>
  </header>

  <div class="container">
    <input type="text" placeholder="image..." maxlength="100">
  <button class="searchBtn">Search</button>
  </div>
    <div id="results"></div>
  <script>
    const input = document.querySelector("input");
    const searchBtn = document.querySelector(".searchBtn");
    const results = document.querySelector("#results");

    const API_KEY = 'jUXc0FJg96k9u1pFLW8mcksYmsXlRkkiMjL_Wn3EK_A'

    searchBtn.addEventListener("click", ()=>{
      returnImage();
    });

    async function returnImage(){
      results.innerHTML = "";

      const searchTerm = input.value;

      const response = await fetch(`https://api.unsplash.com/search/photos?query=${searchTerm}&client_id=${API_KEY}`);

      const data = await response.json();

      console.log(data);

      data.results.forEach(photo=>{
        const imageUrl = photo.urls.small;
        const fullImageUrl = photo.urls.full;
        const newImage = document.createElement("img");
        newImage.src = imageUrl;

        results.appendChild(newImage);

        newImage.addEventListener("click", ()=>{
        window.open(fullImageUrl, "_blank");
      })

      });

      input.addEventListener("keydown", (event)=>{
        if(event.key==="Enter"){
          searchBtn.click();
        }
      });
    }

  </script>
</body>
</html>
